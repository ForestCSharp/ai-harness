name: bench

# Anything here spends real money on the OpenRouter key, so two rules hold.
#
# 1. Fork pull requests can never run it. That is a GitHub constraint rather
#    than a policy choice — secrets are not exposed to `pull_request` from a
#    fork — and the guard below makes the skip explicit instead of leaving the
#    job to fail confusingly on a missing key. Forks still get ci.yml in full.
# 2. The automatic runs are bounded. `smoke` is a single prompt; the full
#    benchmark sweeps are `workflow_dispatch` only, because a 350-instance Claw
#    run per commit is a different order of spend from a smoke test.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Which suite to run
        type: choice
        options: [claw, harnessbench]
        default: claw
      tasks:
        description: How many instances (empty runs the full suite)
        type: string
        default: "20"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: headless smoke
    # `github.repository` on a push, and on a PR only when the branch lives in
    # this repo rather than a fork.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      # The model is not a secret, so it can sit at job level. Pinned in
      # repository variables rather than here, so changing the model a benchmark
      # runs against is a deliberate settings edit and shows up as one.
      OPENROUTER_MODEL: ${{ vars.BENCH_MODEL || 'z-ai/glm-5.3-flash' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

      # The end-to-end assertion that matters for this repository: a headless
      # run against its own source finishes, reports a clean protocol, and
      # produces a record with the shape every adapter parses.
      # The key is scoped to this step rather than the job. At job level it
      # would also be in the environment of checkout, the toolchain installer,
      # the cache action and the artifact uploader — third-party code that has
      # no use for it, and the realistic path by which a secret leaves a public
      # repository. Only the process that talks to OpenRouter gets it.
      - name: run one headless turn
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ./target/release/ai-harness \
            --headless \
            --sandbox none \
            --prompt "How many Rust source files are in src/? Answer with the number." \
            --max-iterations 8 \
            --headless-timeout 240 \
            --headless-output record.json

      - name: check the record
        run: |
          python3 - <<'PY'
          import json, sys
          record = json.load(open("record.json"))
          print(json.dumps(record, indent=2))
          failures = []
          if record["exit"] != "complete":
              failures.append(f"exit was {record['exit']}, expected complete")
          if record["ledger"]["requests"] < 1:
              failures.append("no requests were made")
          # Not a hard failure on its own, but a protocol error on a trivial
          # prompt means the contract or the parser moved. Surfacing it here is
          # the cheapest early warning this repository has.
          if record["protocol_errors"]["total"] > 0:
              failures.append(f"protocol errors: {record['protocol_errors']}")
          if record["questions_declined"] > 0:
              failures.append("the model asked a question on a trivial prompt")
          if failures:
              sys.exit("smoke run failed:\n  " + "\n  ".join(failures))
          print("ok")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-record
          path: record.json

  suite:
    name: ${{ inputs.benchmark }} suite
    # Dispatch only. This is the job that costs real money at scale, and it
    # needs an external benchmark checkout that this repository does not vendor.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 720
    # An approval gate for the job that can spend real money. Add required
    # reviewers to this environment under Settings -> Environments; until you
    # do, the environment exists but gates nothing, so the protection is a
    # settings change rather than a code one. Scoping the key to the environment
    # as well as the step means a dispatch cannot reach it without that approval.
    environment: bench
    env:
      OPENROUTER_MODEL: ${{ vars.BENCH_MODEL || 'z-ai/glm-5.3-flash' }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: ai-harness
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --release --locked
        working-directory: ai-harness

      # Pinned, not HEAD. Two dispatches a month apart must measure the same
      # benchmark or the numbers cannot be compared, and `--depth 1` of a moving
      # branch quietly guarantees they cannot. These are the commits the adapters
      # were written and verified against.
      - name: check out the benchmark
        run: |
          case "${{ inputs.benchmark }}" in
            claw)
              git clone https://github.com/opensquilla/claw-swe-bench bench-repo
              git -C bench-repo checkout fcece5f4c0817430ce953b52c80c931a40cd9b83
              ;;
            harnessbench)
              git clone https://github.com/Qihoo360/harness-bench bench-repo
              git -C bench-repo checkout 1025086a446653702b80cfb48babbeec35db6b2c
              ;;
          esac

      # Fails loudly if an anchor is gone, which means upstream restructured.
      # A silent skip here would produce a run that measures nothing and reports
      # success, which is the one outcome worse than not starting.
      - name: register the adapter
        run: python3 ai-harness/bench/register.py ${{ inputs.benchmark }} bench-repo

      - name: install benchmark dependencies
        run: |
          if [ -f bench-repo/requirements.txt ]; then
            pip install -r bench-repo/requirements.txt
          fi
          pip install -e bench-repo 2>/dev/null || true

      # SWE-bench task images are roughly 2 GB each and a GitHub runner has
      # about 14 GB free, so the instance count is bounded by disk long before
      # it is bounded by money. Reclaiming the preinstalled toolchains buys the
      # room for a handful more.
      - name: free disk space
        if: inputs.benchmark == 'claw'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h / | tail -1

      - name: run the suite
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_HARNESS_BIN: ${{ github.workspace }}/ai-harness/target/release/ai-harness
        run: |
          COUNT="${{ inputs.tasks }}"
          COUNT="${COUNT:-3}"
          case "${{ inputs.benchmark }}" in
            claw)
              head -n "$COUNT" bench-repo/config/multilingual_300_instances.txt > instances.txt
              echo "Running $(wc -l < instances.txt) instance(s):"; cat instances.txt
              cd bench-repo && python3 run_infer.py \
                --claw ai-harness \
                --dataset multilingual \
                --run_id "ci-${{ github.run_id }}" \
                --instance_file ../instances.txt \
                --no_resume
              ;;
            harnessbench)
              cd bench-repo && PYTHONPATH=src python3 -m harnessbench.cli run-suite \
                --harness ai-harness --to-task "$COUNT"
              ;;
          esac

      - name: summarise
        if: always()
        run: |
          python3 - <<'PY'
          import glob, json, pathlib
          records = sorted(glob.glob("bench-repo/artifacts/*/*/run_record.json"))
          if not records:
              print("No run records — the suite produced nothing to summarise.")
              raise SystemExit
          out = pathlib.Path("summary.md")
          rows = ["| instance | exit | iters | writes | perr | tokens in |", "| --- | --- | --- | --- | --- | --- |"]
          for path in records:
              d = json.loads(pathlib.Path(path).read_text())
              rows.append(
                  f"| {pathlib.Path(path).parent.name} | {d.get('exit')} | "
                  f"{d.get('iterations')} | {d.get('actions', {}).get('writes')} | "
                  f"{d.get('protocol_errors', {}).get('total')} | "
                  f"{d.get('ledger', {}).get('prompt_tokens')} |"
              )
          table = "\n".join(rows)
          out.write_text(table + "\n")
          print(table)
          PY
          cat summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.benchmark }}-results
          path: |
            bench-repo/artifacts/**
            bench-repo/results/**
            summary.md
          if-no-files-found: warn
